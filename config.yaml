# Root Hermes Agent Configuration
# Location: /home/Aarz/.hermes/config.yaml
#
# NOTE: This file contains sensitive API keys and secrets.
# The following have been REDACTED before committing:
# - Composio API keys (ck_...)
# - Any other API tokens
#
# After restoring, replace YOUR_COMPOSIO_API_KEY with actual keys.

# Composio Configuration
composio:
  api_key: YOUR_COMPOSIO_API_KEY
  connection_active: true

# MCP Servers Configuration
mcp_servers:
  github:
    command: npx
    args:
      - -y
      - @modelcontextprotocol/server-github
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: YOUR_GITHUB_TOKEN

# Profiles Configuration
profiles:
  default: aarz
  path: /home/Aarz/.hermes/profiles

# Platform Configuration
platforms:
  telegram:
    enabled: true
  discord:
    enabled: false
  slack:
    enabled: false

# Agent Settings
agents:
  max_iterations: 100
  default_timeout: 120

# Logging
logging:
  level: info
  path: /home/Aarz/.hermes/logs
