model:
  default: MiniMax-M2.7
  provider: minimax
  base_url: https://api.minimax.io/anthropic
providers:
  modelrelay:
    type: openai
    base_url: http://127.0.0.1:7352/v1
    api_key: dummy-key
alias:
  default: aarz
profiles:
  aarz:
    path: /home/Aarz/.hermes/profiles/aarz
  bymax:
    path: /home/Aarz/.hermes/profiles/bymax
  jarvis:
    path: /home/Aarz/.hermes/profiles/jarvis
  nina:
    path: /home/Aarz/.hermes/profiles/nina
custom_providers:
- name: ollama
  base_url: http://localhost:11434/v1
  api_key: ollama
skills:
  external_dirs:
  - ~/.hermes/skills
server:
  gateway:
    host: 0.0.0.0
    port: 8642
  dashboard:
    host: 0.0.0.0
    port: 9119
mcp_servers:
  composio:
    url: https://connect.composio.dev/mcp
    headers:
      x-consumer-api-key: YOUR_COMPOSIO_API_KEY
    connect_timeout: 60
    timeout: 180
auxiliary:
  compression:
    provider: openai
    base_url: http://127.0.0.1:7352/v1
    model: gpt-4o-mini
    context_length: 16384
approvals:
  mode: false
