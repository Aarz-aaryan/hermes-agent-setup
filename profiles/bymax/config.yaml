  - ~/.hermes/skills
mcp_servers:
  composio:
    url: https://connect.composio.dev/mcp
    headers:
      x-consumer-api-key: YOUR_COMPOSIO_API_KEY
    connect_timeout: 60
    timeout: 180
auxiliary:
  compression:
    provider: custom
    base_url: http://localhost:11434/v1
    model: qwen2.5:14b
    context_length: 32768
onboarding:
  seen:
    busy_input_prompt: true
