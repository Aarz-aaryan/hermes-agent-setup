model:
  context_length: 200000
  max_tokens: 8192
  default: gpt-5.3-codex
  provider: copilot
  base_url: https://api.githubcopilot.com
  api_mode: chat_completions
providers: {}
fallback_providers: []
toolsets:
- hermes-cli
agent:
  max_turns: 90
  gateway_timeout: 1800
  gateway_notify_interval: 180
  gateway_auto_continue_freshness: 3600
  clarify_timeout: 600
  api_max_retries: 0
  reasoning_effort: medium
  show_reasoning: false
  disabled_toolsets:
  - yuanbao
  - homeassistant
  - spotify
  - x_search
delegation:
  max_concurrent_children: 5
  max_spawn_depth: 1
  orchestrator_enabled: false
  subagent_auto_approve: false
  reasoning_effort: medium
terminal:
  backend: local
  timeout: 180
  persistent_shell: true
display:
  personality: kawaii
  show_reasoning: false
  language: en
memory:
  memory_enabled: true
  user_profile_enabled: true
  provider: mnemosyne
context:
  engine: compressor
skills:
  external_dirs:
  - ~/.hermes/skills
  template_vars: true
_config_version: 24
